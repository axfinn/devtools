name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  # Frontend code quality
  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 统一用 pnpm:项目有 .npmrc(node-linker=hoisted)+ pnpm-workspace.yaml +
        # pnpm-lock.yaml,Dockerfile 也是 pnpm --frozen-lockfile。
        # 原来 CI 走 npm ci 装的是另一套依赖树 —— CI 测的版本和镜像里跑的不是同一份,
        # 两份 lock 文件还会各自漂移(前端漏洞修不动就是因为 npm 这边先坏了)。
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static rules lint
        # 真正会失败的闸门:frontend/scripts/lint-static-rules.mjs 零依赖,
        # 覆盖 R3(模板里对 ref 写 .value)/R4(模板裸下标)/L1(first-party console.log)。
        # 原来的 console.log grep 扫全量 src(含 vendored src/neon 的 59 处)必然命中,
        # exit 1 后又被 continue-on-error 掉 —— 既没拦住东西,又制造"已检查"的错觉。
        run: pnpm lint

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{js,vue,ts,css,scss,json}" || echo "Prettier not configured yet"
        continue-on-error: true

  # Backend code quality
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m || echo "golangci-lint config not found, using defaults"
        continue-on-error: true

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Please run: gofmt -w ."
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check for TODO/FIXME comments
        run: |
          todos=$(grep -r "TODO\|FIXME" . --exclude-dir=vendor --exclude-dir=.git || true)
          if [ -n "$todos" ]; then
            echo "Found TODO/FIXME comments:"
            echo "$todos"
            echo ""
            echo "Please address or track these items before merging"
          fi
        continue-on-error: true

  # Security checks
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit (frontend)
        run: |
          cd frontend
          pnpm audit --audit-level=high || echo "Security vulnerabilities found in frontend dependencies"
        continue-on-error: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Run govulncheck (backend)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend
          govulncheck ./... || echo "Security vulnerabilities found in backend dependencies"
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # Dependency review (for PRs only)
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
        continue-on-error: true
