name: Deploy to Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.26.10'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    # 非 workflow_dispatch 事件(push/PR)下 github.event.inputs 是 null,
    # 表达式会解析成空字符串 → GitHub 判定 workflow 文件非法 → run 直接 0 job 失败。
    # 必须给兜底值。
    environment: ${{ github.event.inputs.environment || 'staging' }}

    # secrets 上下文在 step 的 `if:` 表达式里不可用(step 执行前求值,secrets 还没注入),
    # GitHub 会判定整个 workflow 文件非法 → run 直接 0 job 失败。
    # 正确做法:先把 secret 取到 job 级 env(那里允许 secrets),再用 env 上下文做判断。
    env:
      HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
      HAS_SERVER: ${{ secrets.SERVER_HOST != '' }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PATH: ${{ secrets.SERVER_PATH || '/opt/devtools' }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.HAS_SSH_KEY == 'true'

      - name: Deploy via SSH and Docker Compose
        if: env.HAS_SSH_KEY == 'true' && env.HAS_SERVER == 'true'
        run: |
          # StrictHostKeyChecking=no 会让中间人可以劫持部署通道并拿到服务器凭据 ——
          # 2026-10 的 eMudhra 弱私钥 CA 事件里,curl/Node/Python 默认信任那批链
          # 正是这类风险的现实版本。accept-new 只对首次见到的主机免确认,
          # 已知主机指纹变化仍然会拒绝连接。
          ssh -o StrictHostKeyChecking=accept-new \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" << 'EOF'
            set -e
            cd "$SERVER_PATH"

            echo "Pulling latest changes..."
            git pull origin main

            echo "Pulling latest Docker images..."
            # docker compose(v2)。docker-compose v1 已于 2023 年停止维护,
            # 现代 Docker 只装 v2,写 v1 会直接 command not found。
            docker compose pull

            echo "Restarting services..."
            docker compose down
            docker compose up -d

            echo "Waiting for health check..."
            sleep 10
            docker compose ps

            echo "Deployment completed successfully!"
          EOF
        env:
          # 远端 shell 需要这些变量:heredoc 是带引号的 'EOF',不会在本地展开,
          # 所以要显式传进远端环境。
          SERVER_PATH: ${{ env.SERVER_PATH }}

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to ${{ github.event.inputs.environment || 'staging' }} succeeded!"
          else
            echo "❌ Deployment to ${{ github.event.inputs.environment || 'staging' }} failed!"
          fi

      - name: Send notification to Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        # 颜色放 step 级 env:job 上下文只有到 step 才可用;而且 GitHub 表达式里的
        # 'good'/'danger' 单引号在 YAML 单引号块中层层转义极易写坏
        # (actionlint 会报 unexpected character),放 env 里就绕开了这套转义。
        env:
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"Deployment to ${{ github.event.inputs.environment || 'staging' }}: ${{ job.status }}\",
              \"attachments\": [{
                \"color\": \"$SLACK_COLOR\",
                \"fields\": [
                  {
                    \"title\": \"Repository\",
                    \"value\": \"${{ github.repository }}\",
                    \"short\": true
                  },
                  {
                    \"title\": \"Branch\",
                    \"value\": \"${{ github.ref_name }}\",
                    \"short\": true
                  },
                  {
                    \"title\": \"Commit\",
                    \"value\": \"${{ github.sha }}\",
                    \"short\": true
                  },
                  {
                    \"title\": \"Author\",
                    \"value\": \"${{ github.actor }}\",
                    \"short\": true
                  }
                ]
              }]
            }"
        continue-on-error: true
