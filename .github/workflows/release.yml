name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.26.10'

jobs:
  build:
    name: Build Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          tar -czf frontend-${{ steps.get_version.outputs.VERSION }}.tar.gz frontend/dist

      - name: Install cross compiler for arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build backend binaries
        run: |
          cd backend

          # package main 由 7 个文件组成,必须用 `.` 编译整个包;
          # `./main.go` 文件列表模式只编译 main.go → undefined: newAppRuntime。
          # -tags with_utls:与 Dockerfile:42 一致,否则启动即报 uTLS 未编入。
          # CGO_ENABLED=1:后端依赖 mattn/go-sqlite3,CGO_ENABLED=0 编出来的是
          # 运行即崩的 stub("go-sqlite3 requires cgo to work")。
          # darwin/windows 不再产出:CGO 交叉编译需要 osxcross/mingw 工具链,
          # 与项目"后端跨编译只走 Docker"的规则冲突;这两平台用 Docker 镜像。
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags with_utls -ldflags="-s -w" -o devtools-server-linux-amd64 .
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -tags with_utls -ldflags="-s -w" -o devtools-server-linux-arm64 .

          cd ..

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags "$(git rev-list --tags --skip=1 --max-count=1)" 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          {
            echo "CHANGELOG<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
            echo "previous_tag=$PREVIOUS_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ### Docker (Recommended)
            ```bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/devtools:v${{ steps.get_version.outputs.VERSION }}
            ```

            Or use docker-compose:
            ```bash
            docker-compose up -d
            ```

            ### Binary Installation (Linux only)
            后端依赖 SQLite(CGO),跨平台交叉编译需要额外工具链,原生二进制只提供 Linux 版:
            ```bash
            chmod +x devtools-server-linux-*
            ./devtools-server-linux-amd64
            ```
            macOS / Windows 请用上面的 Docker 镜像(多架构,含 linux/amd64 与 linux/arm64)。

            ## Full Changelog
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.previous_tag }}...v${{ steps.get_version.outputs.VERSION }}
          files: |
            frontend-*.tar.gz
            backend/devtools-server-linux-amd64
            backend/devtools-server-linux-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Seed AskIt extension zip
        # Dockerfile:107 `COPY askit-extension.zip` 需要构建上下文里存在这个文件,
        # 但它被 .gitignore 排除、不在版本库。CI 没有 AskIt 仓库凭据 → 写占位包,
        # 扩展在容器启动后由运行时 SSH 拉取(handlers/askit_extension.go)。
        run: SKIP_ASKIT=1 ./deploy.sh build-askit

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devtools:v${{ steps.get_version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/devtools:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
