name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.26.10'
  GOPROXY: 'https://goproxy.cn,direct'
  GOSUMDB: 'sum.golang.org'

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 统一用 pnpm:项目有 .npmrc(node-linker=hoisted)+ pnpm-workspace.yaml +
        # pnpm-lock.yaml,Dockerfile 也是 pnpm --frozen-lockfile。
        # 原来 CI 走 npm ci 装的是另一套依赖树 —— CI 测的版本和镜像里跑的不是同一份,
        # 两份 lock 文件还会各自漂移(前端漏洞修不动就是因为 npm 这边先坏了)。
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter (静态规则)
        # 真正会失败的闸门:frontend/scripts/lint-static-rules.mjs 零依赖,
        # 覆盖 R3(模板 .value)/R4(裸下标)/L1(console.log)三条会白屏/脏日志的规则。
        # 原来这里是 `npm run lint || echo "ESLint not configured yet"` + continue-on-error,
        # 而 package.json 里根本没有 lint 脚本 → 这道闸门从来没跑过,永远显示绿色。
        run: pnpm lint

      - name: Run tests
        run: pnpm test || echo "Tests not configured yet"
        continue-on-error: true

      - name: Build frontend
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Backend Tests and Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go files must be formatted with gofmt. Please run:"
            echo "  gofmt -s -w ."
            gofmt -s -l .
            exit 1
          fi

      - name: Run file size budget checks
        # Makefile 在仓库根,这个 job 的 working-directory 是 ./backend →
        # 直接 `make lint-go` 会 "No rule to make target",被 || true 吞掉,
        # 这个门禁从来没生效过。-C .. 切到仓库根再执行。
        run: |
          make -C .. lint-go
          make -C .. lint-vue

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./... || echo "Tests not configured yet"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.out
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Build backend
        # `.` 而不是 `./main.go`:package main 由 7 个文件组成,文件列表模式只编译
        # main.go 会 undefined: newAppRuntime。-tags with_utls 与 Dockerfile 一致,
        # 否则产物启动即报 "uTLS ... is not included in this build"。
        run: go build -v -tags with_utls -o devtools-server .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/devtools-server
          retention-days: 7

  # Docker Build and Push
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # secrets 上下文在 step 的 `if:` 表达式里不可用(step 执行前求值,secrets 还没注入),
    # GitHub 会判定整个 workflow 文件非法 → run 直接 0 job 失败。
    # 正确做法:先把 secret 取到 job 级 env(那里允许 secrets),再用 env 上下文做判断。
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Seed AskIt extension zip
        # Dockerfile 里是 `COPY askit-extension.zip`，构建上下文必须先有这个文件。
        # Askit 是私有仓库，CI 既没有凭据也没有 ssh key，所以写占位包 —— 扩展在
        # 容器启动后由运行时 SSH 拉取（handlers/askit_extension.go:128），CI 产物
        # 不受影响。详见 Dockerfile 顶部注释与 deploy.sh 的 build_askit。
        run: SKIP_ASKIT=1 ./deploy.sh build-askit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
        if: github.event_name == 'push' && env.DOCKER_USERNAME != ''

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 仓库没配 DOCKER_USERNAME secret 时,`${{ env.DOCKER_USERNAME }}/devtools`
          # 会变成 "/devtools" → buildx 报 invalid reference format,整步失败。
          # 这种情况回落成一个合法的本地引用,配合下面的 push: false 只构建不推送。
          images: ${{ env.DOCKER_USERNAME != '' && format('{0}/devtools', env.DOCKER_USERNAME) || 'devtools:ci' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        # 有 Docker Hub 凭据才推;没有就只构建不推(下一步)。
        # 原来这一步无条件执行、push 由表达式决定 —— 配上下面那个 `if: DOCKER_USERNAME == ''`
        # 的步骤,两种情况下都会构建一次,等于每次 push 白构建两遍。
        if: env.DOCKER_USERNAME != ''
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and test locally (if not pushing)
        uses: docker/build-push-action@v5
        if: env.DOCKER_USERNAME == ''
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: devtools:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend, security]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Quality gate failed!"
            exit 1
          fi

          echo "Quality gate passed!"
